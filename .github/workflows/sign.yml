name: Otomatik IPA İmzalama

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Zsign İndir, Derle ve Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git g++ pkg-config libssl-dev libplist-dev
          git clone https://github.com/zhlynn/zsign.git
          cd zsign/build/linux
          make
          sudo cp ../../bin/zsign /usr/local/bin/

      - name: Release İçindeki IPA Dosyasını Bul ve İndir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset_url=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | grep "browser_download_url" | grep ".ipa" | cut -d '"' -f 4)
          
          echo "İndirilecek IPA URL: $asset_url"
          
          if [ -z "$asset_url" ]; then
            echo "Hata: IPA dosyası bulunamadı!"
            exit 1
          fi
          
          curl -L -o app.ipa "$asset_url"

      - name: IPA Dosyasını İmzala
        run: |
          # Sertifikasız/Ad-hoc imzalama için -a parametresini ekledik ve çıktıyı belirledik
          zsign -a -o signed_app.ipa app.ipa

      - name: İmzalanmış Dosyayı Release'e Geri Yükle
        uses: softprops/action-gh-release@v2
        with:
          files: signed_app.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
