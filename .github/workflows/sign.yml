name: Otomatik IPA İmzalama

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: İmzalama Aracını (zsign) Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y libplist-utils git curl build-essential libssl-dev
          git clone https://github.com/zhlynn/zsign.git
          cd zsign
          g++ -O3 *.cpp -o zsign -lcrypto
          sudo cp zsign /usr/local/bin/

      - name: Release İçindeki IPA Dosyasını Bul ve İndir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sadece .ipa uzantılı dosyayı seçmek için grep süzgeci
          asset_url=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | grep "browser_download_url" | grep ".ipa" | cut -d '"' -f 4)
          
          echo "İndirilecek IPA URL: $asset_url"
          curl -L -o app.ipa "$asset_url"

      - name: IPA Dosyasını İmzala
        run: |
          # Zsign ile doğrudan ipa imzalama adımı
          zsign -z app.ipa
          
          # zsign çıkış dosyasını signed_app.ipa olarak standartlaştırıyoruz
          if [ -f "app.imayed.ipa" ]; then
            mv app.imayed.ipa signed_app.ipa
          elif [ -f "app.ipa" ]; then
            cp app.ipa signed_app.ipa
          fi

      - name: İmzalanmış Dosyayı Release'e Geri Yükle
        uses: softprops/action-gh-release@v1
        with:
          files: signed_app.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
