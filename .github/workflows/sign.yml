name: Otomatik IPA İmzalama

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Zsign İndir, Derle ve Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git g++ pkg-config libssl-dev libplist-dev
          git clone https://github.com/zhlynn/zsign.git
          cd zsign/build/linux
          make
          sudo cp ../../bin/zsign /usr/local/bin/

      - name: Release Bilgilerini Al ve IPA İndir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target_tag="${{ github.event.release.tag_name }}"
          
          if [ -z "$target_tag" ]; then
            echo "Tag bulunamadı, en güncel release taranıyor..."
            release_api="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          else
            echo "Tetiklenen Tag: $target_tag"
            release_api="https://api.github.com/repos/${{ github.repository }}/releases/tags/$target_tag"
          fi
          
          release_info=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$release_api")
          tag_name=$(echo "$release_info" | grep '"tag_name":' | head -n 1 | cut -d '"' -f 4)
          asset_url=$(echo "$release_info" | grep "browser_download_url" | grep ".ipa" | cut -d '"' -f 4)
          
          echo "İşlem Yapılacak Tag: $tag_name"
          echo "İndirilecek IPA URL: $asset_url"
          
          if [ -z "$asset_url" ]; then
            echo "Hata: Bu release içinde .ipa dosyası bulunamadı! (Windows sürümü olabilir)"
            exit 0
          fi
          
          echo "RELEASE_TAG=$tag_name" >> $GITHUB_ENV
          curl -L -o app.ipa "$asset_url"

      - name: IPA Dosyasını İmzala
        run: |
          if [ ! -f "app.ipa" ]; then
            echo "IPA dosyası yok, imzalama atlanıyor."
            exit 0
          fi
          zsign -a -o signed_app.ipa app.ipa

      - name: İmzalanmış Dosyayı Release'e Yükle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "signed_app.ipa" ]; then
            echo "İmzalanan dosya release'e yükleniyor: ${{ env.RELEASE_TAG }}"
            gh release upload "${{ env.RELEASE_TAG }}" signed_app.ipa --clobber
          else
            echo "Yüklenecek imzalı dosya bulunamadı."
            exit 1
          fi
