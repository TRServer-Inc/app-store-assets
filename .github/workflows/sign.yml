name: Otomatik IPA İmzalama

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Zsign İndir, Derle ve Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y libplist-utils git curl build-essential libssl-dev zlib1g-dev
          git clone https://github.com/zhlynn/zsign.git
          cd zsign
          # Kök dizinde Makefile olduğu için doğrudan 'make' komutu ile derliyoruz
          make
          sudo cp zsign /usr/local/bin/

      - name: Release İçindeki IPA Dosyasını Bul ve İndir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset_url=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | grep "browser_download_url" | grep ".ipa" | cut -d '"' -f 4)
          
          echo "İndirilecek IPA URL: $asset_url"
          curl -L -o app.ipa "$asset_url"

      - name: IPA Dosyasını İmzala
        run: |
          zsign -z app.ipa
          
          if [ -f "app.imayed.ipa" ]; then
            mv app.imayed.ipa signed_app.ipa
          elif [ -f "app.ipa" ]; then
            cp app.ipa signed_app.ipa
          fi

      - name: İmzalanmış Dosyayı Release'e Geri Yükle
        uses: softprops/action-gh-release@v1
        with:
          files: signed_app.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
